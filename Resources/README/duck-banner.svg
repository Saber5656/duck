<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">duck, a quiet rubber-duck debugging companion</title>
  <desc id="description">A small yellow duck sits beside a terminal while listening to an explanation.</desc>
  <rect width="1200" height="300" fill="#f3efe4"/>
  <path d="M0 246H1200" stroke="#d8cfbd" stroke-width="2"/>

  <g transform="translate(72 60)" fill="#242a30">
