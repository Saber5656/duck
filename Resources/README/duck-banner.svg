    <text x="4" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" fill="#59636b">listens, never understands</text>
    <path d="M4 156h265" stroke="#d9952e" stroke-width="8" stroke-linecap="round"/>
  </g>

